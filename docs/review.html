<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Del Medical - PDF Review Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        .page-container { box-shadow: 0 4px 16px rgba(0,0,0,0.6); }
        [data-tool].active { background-color: oklch(var(--p)) !important; color: oklch(var(--pc)) !important; font-weight: 600; }
        .color-btn { transition: all 0.15s; }
        .color-btn:hover { transform: scale(1.15); }
        .color-btn.selected { border-color: white !important; box-shadow: 0 0 0 2px oklch(var(--p)); }
        #file-list > div { border-left: 3px solid transparent; transition: background 0.1s; }
        #file-list > div:hover { background-color: oklch(var(--b3) / 0.7); }
        #file-list > div.bg-primary\/10 { border-left-color: oklch(var(--p)); }
        .annotation-layer { pointer-events: auto !important; }
        #browser-panel, #annotation-sidebar { transition: width 0.3s, min-width 0.3s; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <nav class="navbar bg-base-200 border-b border-base-300 px-4 py-2 flex-shrink-0 z-10 min-h-0">
        <div class="flex-1 flex items-center gap-3">
            <i data-lucide="file-text" class="w-5 h-5 text-primary"></i>
            <span class="text-primary font-bold text-lg whitespace-nowrap">Del Medical PDF Review</span>
        </div>
        <div class="flex-none flex gap-1">
            <button class="btn btn-ghost btn-sm btn-square" id="toggle-browser" title="Toggle file browser"><i data-lucide="folder-tree" class="w-4 h-4"></i></button>
            <button class="btn btn-ghost btn-sm btn-square" id="toggle-annotations" title="Toggle comments"><i data-lucide="message-square-text" class="w-4 h-4"></i></button>
        </div>
    </nav>

    <div class="flex flex-1 overflow-hidden">
        
        <!-- FILE BROWSER -->
        <aside class="w-80 min-w-[320px] bg-base-200 border-r border-base-300 flex flex-col overflow-hidden" id="browser-panel">
            <div class="p-3 border-b border-base-300 flex items-center gap-2 flex-shrink-0">
                <i data-lucide="folder-open" class="w-4 h-4"></i>
                <h3 class="font-semibold text-sm flex-1">Documents</h3>
                <button class="btn btn-ghost btn-xs" id="back-btn" disabled>⬅ Back</button>
            </div>
            <div class="relative m-3">
                <i data-lucide="search" class="w-4 h-4 absolute left-2.5 top-1/2 -translate-y-1/2 text-base-content/40 pointer-events-none"></i>
                <input type="text" class="input input-bordered input-sm w-full pl-8" id="search-input" placeholder="Search files..." />
            </div>
            <div class="flex-1 overflow-y-auto px-1" id="file-list">
                <div class="text-center py-8 text-base-content/50 text-sm">Loading...</div>
            </div>
        </aside>

        <!-- PDF VIEWER -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <div class="bg-base-200 border-b border-base-300 px-3 py-2 items-center gap-2 flex-shrink-0 flex-wrap hidden" id="annotation-toolbar">
                <div class="join">
                    <button class="join-item btn btn-sm btn-ghost active" data-tool="select">🖱 Select</button>
                    <button class="join-item btn btn-sm btn-ghost" data-tool="highlight">🖍 Highlight</button>
                    <button class="join-item btn btn-sm btn-ghost" data-tool="draw">✏️ Draw</button>
                    <button class="join-item btn btn-sm btn-ghost" data-tool="rectangle">⬜ Rect</button>
                    <button class="join-item btn btn-sm btn-ghost" data-tool="comment">📝 Note</button>
                </div>
                <span class="text-xs text-base-content/50 ml-2">Color:</span>
                <span class="w-6 h-6 rounded-full border-2 cursor-pointer color-btn selected" data-color="rgba(255,213,79,0.4)" style="background:#ffd54f;"></span>
                <span class="w-6 h-6 rounded-full border-2 border-transparent cursor-pointer color-btn" data-color="rgba(88,166,255,0.4)" style="background:#58a6ff;"></span>
                <span class="w-6 h-6 rounded-full border-2 border-transparent cursor-pointer color-btn" data-color="rgba(63,185,80,0.4)" style="background:#3fb950;"></span>
                <span class="w-6 h-6 rounded-full border-2 border-transparent cursor-pointer color-btn" data-color="rgba(248,81,73,0.4)" style="background:#f85149;"></span>
                <div class="flex-1"></div>
                <button class="btn btn-ghost btn-sm" id="clear-page-annotations">🗑 Clear Page</button>
                <button class="btn btn-primary btn-sm" id="save-annotations-btn">💾 Save All</button>
            </div>
            <div class="flex-1 overflow-y-auto bg-[#333] relative flex flex-col items-center p-5 gap-4" id="pdf-scroll-container">
                <div class="flex-1 flex flex-col items-center justify-center text-base-content/40 text-center p-10" id="no-pdf-message">
                    <i data-lucide="file-search" class="w-16 h-16 mb-4 opacity-40"></i>
                    <h3 class="text-xl font-semibold text-base-content/60">Select a PDF</h3>
                </div>
            </div>
        </main>

        <!-- SIDEBAR -->
        <aside class="w-[380px] min-w-[380px] bg-base-200 border-l border-base-300 flex flex-col overflow-hidden" id="annotation-sidebar">
            <div class="p-3 border-b border-base-300 flex items-center justify-between flex-shrink-0">
                <h3 class="font-semibold text-sm">💬 Annotations</h3>
                <span class="text-xs text-base-content/50" id="annotation-count">0</span>
            </div>
            <div class="flex-1 overflow-y-auto p-3 flex flex-col gap-2" id="annotation-list">
                <div class="text-center py-8 text-base-content/40 text-sm">Select a PDF to begin.</div>
            </div>
        </aside>
    </div>

    <div class="toast toast-end toast-bottom z-50 hidden" id="toast">
        <div class="alert" id="toast-alert"><span id="toast-message"></span></div>
    </div>

    <div class="fixed bg-base-200 border border-primary rounded-lg px-3 py-2 text-sm cursor-pointer z-[100] hidden shadow-lg" id="quote-popup">💬 Quote &amp; Comment</div>

    <script>
    lucide.createIcons();

    // ============================================================
    // CONFIG
    // ============================================================
    const PROXY = 'https://pdf-review-proxy.mmuqeem.workers.dev';

    // ============================================================
    // STATE
    // ============================================================
    let currentPath = '';
    let currentPDFName = '';
    let annotations = [];
    let fabricCanvases = {};
    let pageContainers = {};
    let currentTool = 'select';
    let currentColor = 'rgba(255,213,79,0.4)';
    let isDrawingRect = false;
    let rectStart = null;
    let tempRect = null;

    // ============================================================
    // HELPERS
    // ============================================================
    const $ = id => document.getElementById(id);

    function toast(msg, type) {
        const t = $('toast');
        const a = $('toast-alert');
        const m = $('toast-message');
        m.textContent = msg;
        a.className = 'alert ' + (type === 'error' ? 'alert-error' : 'alert-success');
        t.classList.remove('hidden');
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.add('hidden'), 3000);
    }

    function esc(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function isDraft(n) { return /Rev_\d+[A-Za-z]/i.test(n); }

    // ============================================================
    // API
    // ============================================================
    async function api(path, opts) {
        opts = opts || {};
        const url = PROXY + path;
        const resp = await fetch(url, {
            headers: { 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
            method: opts.method || 'GET',
            body: opts.body || undefined,
        });
        if (!resp.ok) {
            let err = {};
            try { err = await resp.json(); } catch (e) {}
            throw new Error(err.message || resp.statusText);
        }
        return resp.json();
    }

    async function fetchPDFRaw(contentsPath) {
        const r = await fetch(PROXY + '/raw/master/' + contentsPath);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.arrayBuffer();
    }

    // ============================================================
    // FILE BROWSER
    // ============================================================
    async function loadDir(path) {
        const fl = $('file-list');
        fl.innerHTML = '<div class="text-center py-8 text-base-content/50 text-sm">Loading...</div>';
        currentPath = path;
        try {
            const contents = await api('/contents/' + path);
            if (!Array.isArray(contents)) { fl.innerHTML = '<div class="text-center py-8 text-base-content/50 text-sm">Not a directory.</div>'; return; }
            const folders = contents.filter(c => c.type === 'dir').sort((a, b) => a.name.localeCompare(b.name));
            const pdfs = contents.filter(c => c.type === 'file' && c.name.toLowerCase().endsWith('.pdf')).sort((a, b) => a.name.localeCompare(b.name));
            let h = '';
            folders.forEach(f => {
                h += `<div class="flex items-center gap-2 px-3 py-2 cursor-pointer text-sm hover:bg-base-300 border-l-3 border-transparent select-none" data-path="${f.path}">
                    📁 <span class="truncate">${esc(f.name)}</span></div>`;
            });
            pdfs.forEach(p => {
                const draft = isDraft(p.name);
                const badge = draft ? '<span class="badge badge-warning badge-xs ml-auto">DRAFT</span>' : '<span class="badge badge-success badge-xs ml-auto">RELEASE</span>';
                const active = currentPDFName === p.name ? ' bg-primary/10 border-l-primary' : '';
                h += `<div class="flex items-center gap-2 px-3 py-2 cursor-pointer text-sm hover:bg-base-300 border-l-3 border-transparent${active} select-none" data-path="${p.path}" data-name="${esc(p.name)}">
                    📄 <span class="truncate">${esc(p.name)}</span>${badge}</div>`;
            });
            fl.innerHTML = h;
            fl.querySelectorAll('[data-path]:not([data-name])').forEach(el => el.addEventListener('click', () => loadDir(el.dataset.path)));
            fl.querySelectorAll('[data-name]').forEach(el => el.addEventListener('click', () => loadPDF(el.dataset.path, el.dataset.name)));
            $('back-btn').disabled = !path;
        } catch (err) {
            fl.innerHTML = `<div class="text-center py-8 text-error text-sm">${esc(err.message)}</div>`;
        }
    }

    $('back-btn').addEventListener('click', () => {
        if (!currentPath) return;
        loadDir(currentPath.split('/').slice(0, -1).join('/') || '');
    });

    $('search-input').addEventListener('input', e => {
        const q = e.target.value.toLowerCase();
        $('file-list').querySelectorAll('[data-name]').forEach(el => {
            el.style.display = (el.querySelector('.truncate')?.textContent || '').toLowerCase().includes(q) ? '' : 'none';
        });
    });

    function highlightFile(name) {
        $('file-list').querySelectorAll('[data-name]').forEach(el => el.classList.remove('bg-primary/10', 'border-l-primary'));
        const a = $('file-list').querySelector(`[data-name="${name}"]`);
        if (a) a.classList.add('bg-primary/10', 'border-l-primary');
    }

    // ============================================================
    // ANNOTATION TOOLS
    // ============================================================
    function setTool(tool) {
        currentTool = tool;
        console.log('Tool set to:', tool);
        document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
        const btn = document.querySelector(`[data-tool="${tool}"]`);
        if (btn) btn.classList.add('active');
        Object.values(fabricCanvases).forEach(fc => {
            if (!fc) return;
            fc.isDrawingMode = (tool === 'draw');
            fc.selection = (tool !== 'draw');
            if (tool === 'draw') {
                fc.freeDrawingBrush.color = currentColor.replace(/[\d.]+\)$/, '1)');
                fc.freeDrawingBrush.width = 3;
            }
        });
    }

    function setColor(color) {
        currentColor = color;
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
        const s = document.querySelector(`[data-color="${color}"]`);
        if (s) s.classList.add('selected');
        if (currentTool === 'draw') {
            Object.values(fabricCanvases).forEach(fc => {
                if (fc) fc.freeDrawingBrush.color = color.replace(/[\d.]+\)$/, '1)');
            });
        }
    }

    // Wire toolbar buttons
    document.querySelectorAll('[data-tool]').forEach(b => {
        b.addEventListener('click', () => setTool(b.dataset.tool));
    });
    document.querySelectorAll('.color-btn').forEach(b => {
        b.addEventListener('click', () => setColor(b.dataset.color));
    });

    // ============================================================
    // FABRIC CANVAS CREATION
    // ============================================================
    function createFabricCanvas(pageNum, canvasEl) {
        console.log('Creating fabric canvas for page', pageNum);
        const fc = new fabric.Canvas(canvasEl, {
            selection: true,
            isDrawingMode: false,
            renderOnAddRemove: true,
        });
        
        // Save state when objects are modified
        fc.on('object:modified', () => {
            console.log('Object modified on page', pageNum);
            saveDrawingState(pageNum);
        });
        fc.on('path:created', () => {
            console.log('Path created on page', pageNum);
            saveDrawingState(pageNum);
        });
        
        fabricCanvases[pageNum] = fc;
        setTool(currentTool);
        return fc;
    }

    function saveDrawingState(pageNum) {
        const fc = fabricCanvases[pageNum];
        if (!fc) return;
        const objects = fc.getObjects().map(o => o.toJSON());
        // Remove old drawing annotation for this page
        annotations = annotations.filter(a => !(a.type === 'drawing' && a.page === pageNum));
        if (objects.length > 0) {
            annotations.push({
                type: 'drawing',
                page: pageNum,
                objects: objects,
                color: currentColor,
                timestamp: new Date().toISOString(),
            });
        }
        renderSidebar();
        console.log('Drawing saved. Total annotations:', annotations.length);
    }

    // ============================================================
    // HIGHLIGHT TOOL
    // ============================================================
    function handleTextSelection(e, pageNum) {
        if (currentTool !== 'highlight') return;
        console.log('Highlight attempt on page', pageNum);
        const sel = window.getSelection();
        const text = sel.toString().trim();
        if (!text) return;
        
        const container = pageContainers[pageNum];
        if (!container || !container.contains(sel.anchorNode)) return;

        const range = sel.getRangeAt(0);
        const rects = range.getClientRects();
        const cr = container.getBoundingClientRect();
        const fc = fabricCanvases[pageNum];
        if (!fc) { console.log('No fabric canvas for page', pageNum); return; }

        for (let i = 0; i < rects.length; i++) {
            const r = rects[i];
            const rect = new fabric.Rect({
                left: r.left - cr.left,
                top: r.top - cr.top,
                width: r.width,
                height: r.height,
                fill: currentColor,
                selectable: true,
                opacity: 0.5,
            });
            fc.add(rect);
        }
        fc.renderAll();
        saveDrawingState(pageNum);
        console.log('Highlight added on page', pageNum);
        toast('Text highlighted', 'success');
    }

    // ============================================================
    // STICKY NOTE (DOUBLE-CLICK)
    // ============================================================
    function handleDoubleClick(e, pageNum) {
        if (currentTool !== 'comment') return;
        console.log('Sticky note on page', pageNum);
        const container = pageContainers[pageNum];
        if (!container) return;
        const cr = container.getBoundingClientRect();
        const x = e.clientX - cr.left;
        const y = e.clientY - cr.top;
        const comment = prompt('Add a comment:', '');
        if (!comment) return;

        const fc = fabricCanvases[pageNum];
        if (!fc) return;

        // Add a visible marker
        const circle = new fabric.Circle({
            left: x - 12, top: y - 12, radius: 12,
            fill: '#3fb950', opacity: 0.6,
        });
        const txt = new fabric.Text('📝', {
            left: x - 12, top: y - 14, fontSize: 16,
        });
        const group = new fabric.Group([circle, txt], {
            left: x - 12, top: y - 12,
        });
        fc.add(group);
        fc.renderAll();

        annotations.push({
            type: 'comment',
            page: pageNum,
            comment: comment,
            x: Math.round(x),
            y: Math.round(y),
            timestamp: new Date().toISOString(),
        });
        renderSidebar();
        toast('Note added', 'success');
    }

    // ============================================================
    // RECTANGLE TOOL
    // ============================================================
    $('pdf-scroll-container').addEventListener('mousedown', function(e) {
        if (currentTool !== 'rectangle') return;
        const target = e.target.closest('.page-container');
        if (!target) return;
        const pageNum = parseInt(target.dataset.page);
        const fc = fabricCanvases[pageNum];
        if (!fc) return;

        console.log('Rectangle start on page', pageNum);
        const ptr = fc.getPointer(e);
        isDrawingRect = true;
        rectStart = { x: ptr.x, y: ptr.y };
        tempRect = new fabric.Rect({
            left: ptr.x, top: ptr.y, width: 0, height: 0,
            fill: 'transparent',
            stroke: currentColor.replace(/[\d.]+\)$/, '1)'),
            strokeWidth: 2,
        });
        fc.add(tempRect);
    });

    $('pdf-scroll-container').addEventListener('mousemove', function(e) {
        if (!isDrawingRect || !tempRect) return;
        const target = e.target.closest('.page-container');
        if (!target) return;
        const fc = fabricCanvases[parseInt(target.dataset.page)];
        if (!fc) return;
        const ptr = fc.getPointer(e);
        const w = ptr.x - rectStart.x;
        const h = ptr.y - rectStart.y;
        tempRect.set({
            left: w > 0 ? rectStart.x : ptr.x,
            top: h > 0 ? rectStart.y : ptr.y,
            width: Math.abs(w),
            height: Math.abs(h),
        });
        fc.renderAll();
    });

    $('pdf-scroll-container').addEventListener('mouseup', function(e) {
        if (!isDrawingRect) return;
        isDrawingRect = false;
        if (tempRect && tempRect.width > 5 && tempRect.height > 5) {
            console.log('Rectangle completed');
            tempRect.set({ selectable: true });
            const target = e.target.closest('.page-container');
            if (target) saveDrawingState(parseInt(target.dataset.page));
        } else if (tempRect) {
            try { tempRect.canvas.remove(tempRect); } catch (er) {}
        }
        tempRect = null;
        rectStart = null;
    });

    // ============================================================
    // CLEAR PAGE
    // ============================================================
    $('clear-page-annotations').addEventListener('click', () => {
        // Find the most visible page
        const cr = $('pdf-scroll-container').getBoundingClientRect();
        let bestPage = null, bestOverlap = 0;
        Object.entries(pageContainers).forEach(([pn, el]) => {
            const r = el.getBoundingClientRect();
            const o = Math.max(0, Math.min(r.bottom, cr.bottom) - Math.max(r.top, cr.top));
            if (o > bestOverlap) { bestOverlap = o; bestPage = parseInt(pn); }
        });
        if (!bestPage) return;
        const fc = fabricCanvases[bestPage];
        if (!fc) return;
        fc.clear();
        fc.renderAll();
        annotations = annotations.filter(a => a.page !== bestPage);
        renderSidebar();
        toast('Cleared page ' + bestPage, 'success');
    });

    // ============================================================
    // SIDEBAR
    // ============================================================
    function renderSidebar() {
        const list = $('annotation-list');
        const count = $('annotation-count');
        if (!annotations.length) {
            list.innerHTML = '<div class="text-center py-8 text-base-content/40 text-sm">No annotations yet.</div>';
            count.textContent = '0';
            return;
        }
        annotations.sort((a, b) => a.page - b.page);
        count.textContent = annotations.length;
        list.innerHTML = annotations.map(a => {
            const labels = {
                highlight: '🖍 Highlight',
                quote: '💬 Quote',
                drawing: '✏️ Drawing',
                comment: '📝 Note',
                rectangle: '⬜ Rectangle',
            };
            let body = '';
            if (a.quotedText) body += `<blockquote class="border-l-2 border-secondary pl-2 my-1 text-xs italic">${esc(a.quotedText)}</blockquote>`;
            if (a.comment) body += `<p class="text-sm">${esc(a.comment)}</p>`;
            if (a.type === 'drawing' && !a.comment) body += '<p class="text-xs text-base-content/40">Drawing annotation</p>';
            return `<div class="card card-compact bg-base-100 border border-base-300 cursor-pointer hover:border-primary" data-goto="${a.page}">
                <div class="card-body p-3">
                    <div class="flex items-center gap-2 text-xs text-base-content/50">
                        <span class="badge badge-xs">${labels[a.type] || a.type}</span>
                        <span>Page ${a.page}</span>
                    </div>
                    <div class="mt-1">${body}</div>
                    <div class="text-xs text-base-content/40 mt-1">${new Date(a.timestamp).toLocaleString()}</div>
                </div></div>`;
        }).join('');
        // Click to scroll to page
        list.querySelectorAll('[data-goto]').forEach(card => {
            card.addEventListener('click', () => {
                const pn = parseInt(card.dataset.goto);
                const c = pageContainers[pn];
                if (c) {
                    c.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    c.style.boxShadow = '0 0 0 4px #58a6ff';
                    setTimeout(() => { c.style.boxShadow = '0 4px 16px rgba(0,0,0,0.6)'; }, 1500);
                }
            });
        });
    }

    // ============================================================
    // PDF LOADING
    // ============================================================
    async function loadPDF(contentsPath, name) {
        console.log('=== LOADING PDF:', name, '===');
        console.log('Path:', contentsPath);
        
        // Clean up previous
        Object.values(fabricCanvases).forEach(fc => { try { fc.dispose(); } catch (e) {} });
        fabricCanvases = {};
        pageContainers = {};
        annotations = [];
        
        currentPDFName = name;
        highlightFile(name);
        
        $('no-pdf-message').style.display = 'none';
        $('annotation-toolbar').style.display = 'flex';
        const scroll = $('pdf-scroll-container');
        scroll.innerHTML = '<div class="text-center py-10 text-base-content/50">Loading PDF...</div>';
        $('annotation-list').innerHTML = '<div class="text-center py-8 text-base-content/40 text-sm">No annotations yet.</div>';
        $('annotation-count').textContent = '0';

        try {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            
            const data = await fetchPDFRaw(contentsPath);
            console.log('PDF downloaded:', data.byteLength, 'bytes');
            
            const header = String.fromCharCode.apply(null, new Uint8Array(data.slice(0, 5)));
            console.log('Header:', header);
            if (!header.startsWith('%PDF')) throw new Error('Not a PDF: ' + header);

            const pdfDoc = await pdfjsLib.getDocument({ data: data }).promise;
            console.log('Pages:', pdfDoc.numPages);
            
            scroll.innerHTML = '';
            
            for (let i = 1; i <= pdfDoc.numPages; i++) {
                const page = await pdfDoc.getPage(i);
                const vp = page.getViewport({ scale: 1.5 });
                
                // Create page container
                const pc = document.createElement('div');
                pc.className = 'page-container relative bg-white flex-shrink-0';
                pc.style.width = vp.width + 'px';
                pc.style.height = vp.height + 'px';
                pc.dataset.page = i;
                pageContainers[i] = pc;

                // PDF canvas
                const pCanvas = document.createElement('canvas');
                pCanvas.width = vp.width;
                pCanvas.height = vp.height;
                pCanvas.style.display = 'block';
                await page.render({ canvasContext: pCanvas.getContext('2d'), viewport: vp }).promise;
                pc.appendChild(pCanvas);

                // Annotation canvas
                const aCanvas = document.createElement('canvas');
                aCanvas.width = vp.width;
                aCanvas.height = vp.height;
                aCanvas.className = 'annotation-layer';
                aCanvas.style.position = 'absolute';
                aCanvas.style.top = '0';
                aCanvas.style.left = '0';
                aCanvas.style.width = vp.width + 'px';
                aCanvas.style.height = vp.height + 'px';
                pc.appendChild(aCanvas);

                // Fabric canvas
                createFabricCanvas(i, aCanvas);

                // Events
                pc.addEventListener('mouseup', function(e) { handleTextSelection(e, i); });
                pc.addEventListener('dblclick', function(e) { handleDoubleClick(e, i); });

                // Page label
                const label = document.createElement('div');
                label.style.cssText = 'position:absolute;bottom:8px;right:12px;background:rgba(0,0,0,0.6);color:white;padding:2px 8px;border-radius:4px;font-size:0.7rem;pointer-events:none;';
                label.textContent = 'Page ' + i;
                pc.appendChild(label);

                scroll.appendChild(pc);
            }

            console.log('All pages rendered. Fabric canvases:', Object.keys(fabricCanvases).length);
            toast('Loaded ' + pdfDoc.numPages + ' pages', 'success');
            
        } catch (err) {
            console.error('PDF load error:', err);
            scroll.innerHTML = `<div class="flex-1 flex flex-col items-center justify-center p-10"><h3 class="text-error text-xl">Failed</h3><p class="text-sm">${esc(err.message)}</p></div>`;
            toast('Error: ' + err.message, 'error');
        }
    }

    // ============================================================
    // PANEL TOGGLES
    // ============================================================
    $('toggle-browser').addEventListener('click', () => {
        const p = $('browser-panel');
        p.classList.toggle('!w-0');
        p.classList.toggle('!min-w-0');
    });
    $('toggle-annotations').addEventListener('click', () => {
        const p = $('annotation-sidebar');
        p.classList.toggle('!w-0');
        p.classList.toggle('!min-w-0');
    });

    // ============================================================
    // KEYBOARD
    // ============================================================
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') setTool('select');
        if (e.key === 'h' && !e.ctrlKey && document.activeElement === document.body) setTool('highlight');
        if (e.key === 'd' && !e.ctrlKey && document.activeElement === document.body) setTool('draw');
        if (e.key === 'r' && !e.ctrlKey && document.activeElement === document.body) setTool('rectangle');
        if (e.key === 'n' && !e.ctrlKey && document.activeElement === document.body) setTool('comment');
    });

    // ============================================================
    // START
    // ============================================================
    console.log('App initializing...');
    loadDir('').then(() => {
        console.log('Repository loaded');
        toast('Connected to DelMedicalRelease', 'success');
    }).catch(err => {
        console.error('Init error:', err);
        toast('Failed: ' + err.message, 'error');
    });
    </script>
</body>
</html>
