<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Del Medical - PDF Review Portal</title>
    
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    
    <style>
        .page-wrapper {
            position: relative; display: block;
            box-shadow: 0 4px 16px rgba(0,0,0,0.6);
            flex-shrink: 0; margin: 0 auto; background: white;
        }
        .page-wrapper canvas { display: block; }
        .page-wrapper .ann-canvas { position: absolute; top: 0; left: 0; z-index: 10; }
        .textLayer {
            position: absolute; top: 0; left: 0; overflow: hidden; z-index: 5;
            opacity: 1; line-height: 1.0;
        }
        .textLayer span {
            color: transparent; position: absolute; white-space: pre;
            cursor: text; transform-origin: 0% 0%;
        }
        .textLayer ::selection { background: rgba(0,120,255,0.3); }
        .page-label {
            position: absolute; bottom: 8px; right: 12px;
            background: rgba(0,0,0,0.6); color: white; padding: 2px 8px;
            border-radius: 4px; font-size: 0.7rem; pointer-events: none; z-index: 20;
        }
        [data-tool].tool-active {
            background-color: oklch(var(--p)) !important;
            color: oklch(var(--pc)) !important;
        }
        .color-btn { transition: all 0.15s; }
        .color-btn:hover { transform: scale(1.2); }
        .color-btn.selected { border-color: white !important; box-shadow: 0 0 0 2px oklch(var(--p)); }
        #file-list .file-row {
            border-left: 3px solid transparent; transition: background 0.1s;
        }
        #file-list .file-row:hover { background-color: oklch(var(--b3) / 0.7); }
        #file-list .file-row.active-file {
            border-left-color: oklch(var(--p));
            background-color: oklch(var(--p) / 0.1);
        }
        #browser-panel, #annotation-sidebar {
            transition: width 0.3s ease, min-width 0.3s ease;
        }
        #file-list::-webkit-scrollbar,
        #pdf-scroll-container::-webkit-scrollbar,
        #annotation-list::-webkit-scrollbar { width: 6px; }
        #file-list::-webkit-scrollbar-thumb,
        #pdf-scroll-container::-webkit-scrollbar-thumb,
        #annotation-list::-webkit-scrollbar-thumb {
            background: oklch(var(--b3)); border-radius: 3px;
        }
        .sync-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- ==================== NAVBAR ==================== -->
    <nav class="navbar bg-base-200 border-b border-base-300 px-4 py-2 flex-shrink-0 z-20 min-h-0 gap-2">
        <div class="flex-1 flex items-center gap-3 min-w-0">
            <i data-lucide="file-text" class="w-5 h-5 text-primary flex-shrink-0"></i>
            <span class="text-primary font-bold text-lg hidden sm:inline">Del Medical</span>
            <span class="text-base-content/50 hidden sm:inline">|</span>
            <span class="text-sm text-base-content/50 truncate hidden md:inline" id="current-pdf-name">PDF Review Portal</span>
        </div>
        <div class="flex-none flex items-center gap-1">
            <!-- Sync status -->
            <div class="tooltip tooltip-bottom" data-tip="Sync status with GitHub Issues">
                <span class="badge badge-sm gap-1" id="sync-badge">
                    <i data-lucide="cloud" class="w-3 h-3"></i> <span id="sync-label">GitHub</span>
                </span>
            </div>
            <!-- Save to GitHub button -->
            <button class="btn btn-ghost btn-sm" id="sync-btn" title="Sync annotations to GitHub Issues">
                <i data-lucide="upload" class="w-4 h-4"></i>
            </button>
            <!-- Theme -->
            <div class="dropdown dropdown-end">
                <button class="btn btn-ghost btn-sm btn-square" tabindex="0" title="Change theme">
                    <i data-lucide="palette" class="w-4 h-4"></i>
                </button>
                <ul tabindex="0" class="dropdown-content z-30 menu p-2 shadow-lg bg-base-200 rounded-box w-48 mt-2">
                    <li class="menu-title"><span>Themes</span></li>
                    <li><a href="#" data-theme-switch="dark"><i data-lucide="moon" class="w-4 h-4"></i> Dark</a></li>
                    <li><a href="#" data-theme-switch="light"><i data-lucide="sun" class="w-4 h-4"></i> Light</a></li>
                    <li><a href="#" data-theme-switch="cupcake"><i data-lucide="cake" class="w-4 h-4"></i> Cupcake</a></li>
                    <li><a href="#" data-theme-switch="cyberpunk"><i data-lucide="zap" class="w-4 h-4"></i> Cyberpunk</a></li>
                    <li><a href="#" data-theme-switch="forest"><i data-lucide="trees" class="w-4 h-4"></i> Forest</a></li>
                    <li><a href="#" data-theme-switch="dracula"><i data-lucide="skull" class="w-4 h-4"></i> Dracula</a></li>
                </ul>
            </div>
            <button class="btn btn-ghost btn-sm btn-square" id="toggle-browser" title="Toggle file browser">
                <i data-lucide="folder-tree" class="w-4 h-4"></i>
            </button>
            <button class="btn btn-ghost btn-sm btn-square" id="toggle-annotations" title="Toggle comments">
                <i data-lucide="message-square-text" class="w-4 h-4"></i>
            </button>
        </div>
    </nav>

    <!-- ==================== MAIN LAYOUT ==================== -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- FILE BROWSER -->
        <aside class="w-80 min-w-[320px] bg-base-200 border-r border-base-300 flex flex-col overflow-hidden" id="browser-panel">
            <div class="p-3 border-b border-base-300 flex items-center gap-2 flex-shrink-0">
                <i data-lucide="folder-open" class="w-4 h-4 text-warning"></i>
                <h3 class="font-semibold text-sm flex-1">Documents</h3>
                <button class="btn btn-ghost btn-xs" id="back-btn" disabled>
                    <i data-lucide="arrow-left" class="w-3 h-3"></i> Back
                </button>
            </div>
            <div class="p-3">
                <label class="input input-bordered input-sm flex items-center gap-2">
                    <i data-lucide="search" class="w-4 h-4 text-base-content/40"></i>
                    <input type="text" class="grow" id="search-input" placeholder="Search files..." />
                </label>
            </div>
            <div class="flex-1 overflow-y-auto" id="file-list">
                <div class="text-center py-8 text-base-content/50 text-sm">
                    <span class="loading loading-spinner loading-sm"></span> Loading...
                </div>
            </div>
        </aside>

        <!-- PDF VIEWER -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <div class="bg-base-200 border-b border-base-300 px-3 py-2 flex-shrink-0 hidden" id="annotation-toolbar">
                <div class="flex items-center gap-2 flex-wrap w-full">
                    <div class="join flex-shrink-0">
                        <button class="join-item btn btn-sm tool-active" data-tool="select">
                            <i data-lucide="mouse-pointer-2" class="w-4 h-4"></i>
                            <span class="hidden sm:inline ml-1">Select</span>
                        </button>
                        <button class="join-item btn btn-sm" data-tool="highlight">
                            <i data-lucide="highlighter" class="w-4 h-4"></i>
                            <span class="hidden sm:inline ml-1">Highlight</span>
                        </button>
                        <button class="join-item btn btn-sm" data-tool="draw">
                            <i data-lucide="pen" class="w-4 h-4"></i>
                            <span class="hidden sm:inline ml-1">Draw</span>
                        </button>
                        <button class="join-item btn btn-sm" data-tool="rectangle">
                            <i data-lucide="square-dashed" class="w-4 h-4"></i>
                            <span class="hidden sm:inline ml-1">Rect</span>
                        </button>
                        <button class="join-item btn btn-sm" data-tool="comment">
                            <i data-lucide="sticky-note" class="w-4 h-4"></i>
                            <span class="hidden sm:inline ml-1">Note</span>
                        </button>
                    </div>
                    <div class="divider divider-horizontal mx-1"></div>
                    <span class="text-xs text-base-content/50 flex-shrink-0">Color:</span>
                    <div class="flex gap-1">
                        <span class="color-btn w-6 h-6 rounded-full border-2 selected flex-shrink-0" data-color="rgba(255,213,79,0.45)" style="background:#ffd54f;" title="Yellow"></span>
                        <span class="color-btn w-6 h-6 rounded-full border-2 border-transparent flex-shrink-0" data-color="rgba(88,166,255,0.45)" style="background:#58a6ff;" title="Blue"></span>
                        <span class="color-btn w-6 h-6 rounded-full border-2 border-transparent flex-shrink-0" data-color="rgba(63,185,80,0.45)" style="background:#3fb950;" title="Green"></span>
                        <span class="color-btn w-6 h-6 rounded-full border-2 border-transparent flex-shrink-0" data-color="rgba(248,81,73,0.45)" style="background:#f85149;" title="Red"></span>
                    </div>
                    <div class="flex-1"></div>
                    <button class="btn btn-ghost btn-sm" id="undo-btn" title="Undo"><i data-lucide="undo-2" class="w-4 h-4"></i></button>
                    <button class="btn btn-ghost btn-sm text-error" id="clear-page" title="Clear page"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto bg-[#525659] flex flex-col items-center py-5 gap-4" id="pdf-scroll-container">
                <div class="flex-1 flex flex-col items-center justify-center text-white/40 text-center p-10" id="no-pdf-message">
                    <i data-lucide="file-search" class="w-20 h-20 mb-4 opacity-30"></i>
                    <h3 class="text-2xl font-semibold text-white/50">Select a PDF to review</h3>
                    <p class="mt-2 text-sm">Browse the file tree on the left</p>
                </div>
            </div>
        </main>

        <!-- ANNOTATION SIDEBAR -->
        <aside class="w-[400px] min-w-[400px] bg-base-200 border-l border-base-300 flex flex-col overflow-hidden" id="annotation-sidebar">
            <div class="p-3 border-b border-base-300 flex items-center justify-between flex-shrink-0">
                <h3 class="font-semibold text-sm flex items-center gap-2">
                    <i data-lucide="message-square-text" class="w-4 h-4 text-info"></i> Annotations
                </h3>
                <span class="badge badge-sm" id="annotation-count">0</span>
            </div>
            <div class="p-3 border-b border-base-300 flex-shrink-0">
                <label class="form-control w-full">
                    <div class="label py-0 pb-1">
                        <span class="label-text text-xs flex items-center gap-1"><i data-lucide="user" class="w-3 h-3"></i> Reviewer</span>
                    </div>
                    <input type="text" class="input input-bordered input-sm w-full" id="reviewer-name" placeholder="Enter your name..." />
                </label>
            </div>
            <div class="flex-1 overflow-y-auto p-3 flex flex-col gap-2" id="annotation-list">
                <div class="text-center py-8 text-base-content/40 text-sm">
                    <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2 opacity-40"></i>
                    <p>No annotations yet</p>
                </div>
            </div>
            <div class="p-2 border-t border-base-300 flex-shrink-0">
                <div class="flex items-center justify-between text-xs text-base-content/40">
                    <span class="flex items-center gap-1"><i data-lucide="hard-drive" class="w-3 h-3"></i> Local</span>
                    <span class="flex items-center gap-1"><i data-lucide="github" class="w-3 h-3"></i> Issues</span>
                </div>
            </div>
        </aside>
    </div>

    <!-- TOAST -->
    <div class="toast toast-end toast-bottom z-50 hidden" id="toast">
        <div class="alert" id="toast-alert">
            <i data-lucide="check-circle" class="w-4 h-4 hidden" id="toast-icon-ok"></i>
            <i data-lucide="alert-circle" class="w-4 h-4 hidden" id="toast-icon-err"></i>
            <span id="toast-message"></span>
        </div>
    </div>

    <!-- COMMENT MODAL -->
    <dialog id="comment-modal" class="modal">
        <div class="modal-box">
            <h3 class="text-lg font-bold flex items-center gap-2">
                <i data-lucide="message-circle" class="w-5 h-5"></i> Add Comment
            </h3>
            <p class="text-sm text-base-content/60 mt-1" id="modal-context"></p>
            <textarea class="textarea textarea-bordered w-full mt-3" id="modal-comment" rows="3" placeholder="Enter your comment..."></textarea>
            <div class="modal-action">
                <button class="btn btn-ghost btn-sm" id="modal-cancel">Skip</button>
                <button class="btn btn-primary btn-sm" id="modal-save">
                    <i data-lucide="save" class="w-4 h-4"></i> Save
                </button>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <script>
    lucide.createIcons();

    const PROXY = 'https://pdf-review-proxy.mmuqeem.workers.dev';
    const $ = id => document.getElementById(id);
    const STORAGE_KEY = 'delmed-annotations-v2';
    const ISSUE_LABEL_PREFIX = 'pdf-review';
    const OWNER = 'DelMedicalTW';
    const REPO = 'DelMedicalRelease';

    // ============================================================
    // STATE
    // ============================================================
    let currentPath = '';
    let currentPDFName = '';
    let annotations = {};
    let fabricCanvases = {};
    let pageContainers = {};
    let currentTool = 'select';
    let currentColor = 'rgba(255,213,79,0.45)';
    let isLoadingPDF = false;
    let syncInProgress = false;

    // ============================================================
    // THEME
    // ============================================================
    const savedTheme = localStorage.getItem('delmed-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.querySelectorAll('[data-theme-switch]').forEach(el => {
        el.addEventListener('click', (e) => {
            e.preventDefault();
            const theme = el.dataset.themeSwitch;
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('delmed-theme', theme);
            el.closest('.dropdown')?.querySelector('button')?.blur();
        });
    });

    // ============================================================
    // REVIEWER
    // ============================================================
    const reviewerInput = $('reviewer-name');
    if (reviewerInput) {
        reviewerInput.value = localStorage.getItem('delmed-reviewer') || '';
        reviewerInput.addEventListener('change', () => {
            localStorage.setItem('delmed-reviewer', reviewerInput.value.trim());
        });
    }
    function getReviewer() {
        return (reviewerInput && reviewerInput.value.trim()) || 'Anonymous';
    }

    // ============================================================
    // TOAST
    // ============================================================
    function toast(msg, type) {
        const t = $('toast'), a = $('toast-alert'), m = $('toast-message');
        const ok = $('toast-icon-ok'), err = $('toast-icon-err');
        if (!t || !a || !m) return;
        m.textContent = msg;
        a.className = 'alert ' + (type === 'error' ? 'alert-error' : 'alert-success');
        ok.classList.toggle('hidden', type === 'error');
        err.classList.toggle('hidden', type !== 'error');
        t.classList.remove('hidden');
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.add('hidden'), 3500);
    }

    function esc(s) {
        const d = document.createElement('div');
        d.textContent = s || '';
        return d.innerHTML;
    }

    // ============================================================
    // GITHUB ISSUES API
    // ============================================================
    async function githubAPI(path, opts) {
        opts = opts || {};
        const headers = { 'Accept': 'application/vnd.github.v3+json' };
        if (opts.body) headers['Content-Type'] = 'application/json';
        const resp = await fetch(PROXY + path, {
            headers,
            method: opts.method || 'GET',
            body: opts.body || undefined,
        });
        if (!resp.ok) {
            let err = {};
            try { err = await resp.json(); } catch (e) {}
            throw new Error(err.message || 'GitHub API ' + resp.status);
        }
        return resp.json();
    }

    function getIssueLabel(pdfName) {
        // Create a safe label from the PDF name
        const safe = pdfName.replace(/[^a-zA-Z0-9_-]/g, '-').substring(0, 50);
        return ISSUE_LABEL_PREFIX + ':' + safe;
    }

    async function fetchIssuesForPDF(pdfName) {
        const label = getIssueLabel(pdfName);
        const allIssues = [];
        let page = 1;
        while (true) {
            const batch = await githubAPI(`/issues?labels=${encodeURIComponent(label)}&state=all&per_page=100&page=${page}`);
            if (!batch.length) break;
            allIssues.push(...batch);
            page++;
        }
        // Filter for our annotation issues
        return allIssues.filter(issue => issue.body && issue.body.includes('<!-- delmed-pdf-annotation -->'));
    }

    async function createAnnotationIssue(pdfName, annotationData) {
        const label = getIssueLabel(pdfName);
        const typeIcons = {
            highlight: '🖍', drawing: '✏️', rectangle: '⬜', comment: '📝'
        };
        const icon = typeIcons[annotationData.type] || '📌';
        const title = `[${pdfName}] Page ${annotationData.page}: ${icon} ${annotationData.type} — ${(annotationData.comment || '').substring(0, 60)}`;
        
        const body = `<!-- delmed-pdf-annotation -->
| Field | Value |
|---|---|
| **PDF** | ${pdfName} |
| **Page** | ${annotationData.page} |
| **Type** | ${annotationData.type} |
| **Reviewer** | ${annotationData.reviewer || 'Unknown'} |
| **Date** | ${annotationData.timestamp} |
| **Color** | ${annotationData.color || 'default'} |

**Comment:** ${annotationData.comment || 'No comment'}

${annotationData.quotedText ? '**Quoted Text:**\n> ' + annotationData.quotedText + '\n' : ''}

\`\`\`json
${JSON.stringify(annotationData, null, 2)}
\`\`\`
`;

        return githubAPI('/issues', {
            method: 'POST',
            body: JSON.stringify({
                title,
                body,
                labels: [label],
            }),
        });
    }

    async function updateAnnotationIssue(issueNumber, annotationData) {
        const body = `<!-- delmed-pdf-annotation -->
| Field | Value |
|---|---|
| **PDF** | ${currentPDFName} |
| **Page** | ${annotationData.page} |
| **Type** | ${annotationData.type} |
| **Reviewer** | ${annotationData.reviewer || 'Unknown'} |
| **Date** | ${annotationData.timestamp} |
| **Color** | ${annotationData.color || 'default'} |

**Comment:** ${annotationData.comment || 'No comment'}

${annotationData.quotedText ? '**Quoted Text:**\n> ' + annotationData.quotedText + '\n' : ''}

\`\`\`json
${JSON.stringify(annotationData, null, 2)}
\`\`\`
`;
        return githubAPI(`/issues/${issueNumber}`, {
            method: 'PATCH',
            body: JSON.stringify({ body }),
        });
    }

    async function closeAnnotationIssue(issueNumber) {
        return githubAPI(`/issues/${issueNumber}`, {
            method: 'PATCH',
            body: JSON.stringify({ state: 'closed' }),
        });
    }

    // ============================================================
    // SYNC FUNCTIONS
    // ============================================================
    function getAnnotations() {
        return annotations[currentPDFName] || [];
    }

    function setAnnotations(anns) {
        annotations[currentPDFName] = anns;
    }

    // Save to localStorage
    function saveLocal() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(annotations));
        } catch (e) {
            toast('Local storage full', 'error');
        }
    }

    // Load from localStorage
    function loadLocal() {
        try {
            const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            annotations = data;
        } catch (e) {
            annotations = {};
        }
    }

    // Sync current PDF annotations to GitHub
    async function syncToGitHub() {
        if (syncInProgress || !currentPDFName) return;
        syncInProgress = true;
        const syncBadge = $('sync-badge');
        const syncLabel = $('sync-label');
        
        try {
            syncBadge.className = 'badge badge-sm badge-warning gap-1';
            syncLabel.textContent = 'Syncing...';
            
            const anns = getAnnotations();
            let synced = 0;
            let updated = 0;

            for (const ann of anns) {
                try {
                    if (ann.issueNumber) {
                        // Update existing issue
                        await updateAnnotationIssue(ann.issueNumber, ann);
                        updated++;
                    } else {
                        // Create new issue
                        const issue = await createAnnotationIssue(currentPDFName, ann);
                        ann.issueNumber = issue.number;
                        ann.issueUrl = issue.html_url;
                        synced++;
                    }
                } catch (err) {
                    console.warn('Failed to sync annotation:', err.message);
                }
            }

            setAnnotations(anns);
            saveLocal();
            renderSidebar();

            syncBadge.className = 'badge badge-sm badge-success gap-1';
            syncLabel.textContent = 'Synced';
            toast(`Synced: ${synced} new, ${updated} updated`, 'success');
            
        } catch (err) {
            syncBadge.className = 'badge badge-sm badge-error gap-1';
            syncLabel.textContent = 'Error';
            toast('Sync failed: ' + err.message, 'error');
        } finally {
            syncInProgress = false;
            setTimeout(() => {
                syncBadge.className = 'badge badge-sm badge-ghost gap-1';
                syncLabel.textContent = 'GitHub';
            }, 3000);
        }
    }

    // Load annotations from GitHub for the current PDF
    async function loadFromGitHub(pdfName) {
        try {
            const issues = await fetchIssuesForPDF(pdfName);
            const githubAnns = [];

            for (const issue of issues) {
                const jsonMatch = issue.body.match(/```json\n([\s\S]*?)\n```/);
                if (!jsonMatch) continue;
                try {
                    const data = JSON.parse(jsonMatch[1]);
                    data.issueNumber = issue.number;
                    data.issueUrl = issue.html_url;
                    data.issueState = issue.state;
                    githubAnns.push(data);
                } catch (e) {}
            }

            // Merge with local annotations (prefer GitHub versions with issue numbers)
            const localAnns = annotations[pdfName] || [];
            const merged = [];
            const seenIssueNumbers = new Set();

            // Add GitHub annotations first
            githubAnns.forEach(a => {
                merged.push(a);
                if (a.issueNumber) seenIssueNumbers.add(a.issueNumber);
            });

            // Add local annotations that don't have a matching GitHub issue
            localAnns.forEach(a => {
                if (!a.issueNumber || !seenIssueNumbers.has(a.issueNumber)) {
                    if (!merged.some(m => m.timestamp === a.timestamp && m.page === a.page && m.type === a.type)) {
                        merged.push(a);
                    }
                }
            });

            annotations[pdfName] = merged;
            saveLocal();

            if (githubAnns.length > 0) {
                toast(`Loaded ${githubAnns.length} annotations from GitHub`, 'success');
            }
        } catch (err) {
            console.warn('Could not load from GitHub:', err.message);
            // Fall back to local
        }
    }

    // ============================================================
    // COMMENT MODAL
    // ============================================================
    const commentModal = $('comment-modal');
    const modalContext = $('modal-context');
    const modalComment = $('modal-comment');
    let modalCallback = null;

    function showCommentModal(context, callback) {
        modalContext.textContent = context;
        modalComment.value = '';
        modalCallback = callback;
        commentModal.showModal();
        setTimeout(() => modalComment.focus(), 100);
    }

    $('modal-save').addEventListener('click', () => {
        const comment = modalComment.value.trim();
        if (modalCallback) modalCallback(comment || '');
        commentModal.close();
        modalCallback = null;
    });

    $('modal-cancel').addEventListener('click', () => {
        commentModal.close();
        if (modalCallback) modalCallback('');
        modalCallback = null;
    });

    // ============================================================
    // FOLDER TYPE DETECTION
    // ============================================================
    function getFolderInfo(path) {
        const lower = (path || '').toLowerCase();
        if (lower.includes('staging')) return { label: 'STAGING', cls: 'badge-warning', icon: 'package-open', desc: 'Pre-release preparation' };
        if (lower.includes('draft')) return { label: 'DRAFTS', cls: 'badge-error', icon: 'pencil', desc: 'Work in progress' };
        if (lower.includes('archive')) return { label: 'ARCHIVE', cls: 'badge-ghost', icon: 'archive', desc: 'Historical documents' };
        if (lower.includes('service')) return { label: 'SERVICE', cls: 'badge-info', icon: 'wrench', desc: 'Service documentation' };
        if (lower.includes('user')) return { label: 'USER', cls: 'badge-success', icon: 'users', desc: 'User documentation' };
        return null;
    }

    function isDraft(filename) {
        return /Rev_\d+[A-Za-z]/i.test(filename);
    }

    // ============================================================
    // FILE BROWSER
    // ============================================================
    async function loadDir(path) {
        const fl = $('file-list');
        if (!fl) return;
        fl.innerHTML = '<div class="text-center py-8 text-base-content/50 text-sm"><span class="loading loading-spinner loading-sm"></span> Loading...</div>';
        currentPath = path;
        try {
            const contents = await githubAPI('/contents/' + path);
            if (!Array.isArray(contents)) {
                fl.innerHTML = '<div class="text-center py-8 text-base-content/50 text-sm">Not a directory.</div>';
                return;
            }
            const folders = contents.filter(c => c.type === 'dir').sort((a,b) => a.name.localeCompare(b.name));
            const pdfs = contents.filter(c => c.type === 'file' && c.name.toLowerCase().endsWith('.pdf')).sort((a,b) => a.name.localeCompare(b.name));
            
            let h = '';
            const folderInfo = getFolderInfo(path);
            if (folderInfo) {
                h += `<div class="px-3 py-2 bg-base-300/50 border-b border-base-300">
                    <div class="flex items-center gap-2">
                        <span class="badge ${folderInfo.cls} badge-sm gap-1"><i data-lucide="${folderInfo.icon}" class="w-3 h-3"></i> ${folderInfo.label}</span>
                        <span class="text-xs text-base-content/60">${folderInfo.desc}</span>
                    </div>
                </div>`;
            }

            folders.forEach(f => {
                const fi = getFolderInfo(f.path);
                const badge = fi ? `<span class="badge ${fi.cls} badge-xs ml-auto flex-shrink-0">${fi.label}</span>` : '';
                h += `<div class="file-row flex items-center gap-2 px-3 py-2 cursor-pointer text-sm select-none" data-path="${esc(f.path)}">
                    <i data-lucide="folder" class="w-4 h-4 flex-shrink-0 text-warning"></i>
                    <span class="truncate">${esc(f.name)}</span>${badge}
                </div>`;
            });

            pdfs.forEach(p => {
                const draft = isDraft(p.name);
                const fi = getFolderInfo(currentPath);
                let badgeHtml = '';
                if (draft) {
                    badgeHtml = `<span class="badge badge-error badge-xs ml-auto flex-shrink-0">DRAFT</span>`;
                } else if (fi) {
                    badgeHtml = `<span class="badge ${fi.cls} badge-xs ml-auto flex-shrink-0">${fi.label}</span>`;
                }
                const active = currentPDFName === p.name ? ' active-file' : '';
                h += `<div class="file-row flex items-center gap-2 px-3 py-2 cursor-pointer text-sm select-none${active}" data-path="${esc(p.path)}" data-name="${esc(p.name)}">
                    <i data-lucide="file-text" class="w-4 h-4 flex-shrink-0 text-error"></i>
                    <span class="truncate">${esc(p.name)}</span>${badgeHtml}
                </div>`;
            });

            fl.innerHTML = h;
            lucide.createIcons();

            fl.querySelectorAll('.file-row[data-path]:not([data-name])').forEach(el => {
                el.onclick = () => loadDir(el.dataset.path);
            });
            fl.querySelectorAll('.file-row[data-name]').forEach(el => {
                el.onclick = () => loadPDF(el.dataset.path, el.dataset.name);
            });

            const backBtn = $('back-btn');
            if (backBtn) backBtn.disabled = !path;
        } catch (err) {
            fl.innerHTML = `<div class="text-center py-8 text-error text-sm">
                <i data-lucide="alert-triangle" class="w-6 h-6 mx-auto mb-1"></i>
                ${esc(err.message)}
            </div>`;
            lucide.createIcons();
        }
    }

    $('back-btn').onclick = () => {
        if (currentPath) loadDir(currentPath.split('/').slice(0,-1).join('/') || '');
    };

    $('search-input').oninput = e => {
        const q = e.target.value.toLowerCase();
        $('file-list').querySelectorAll('.file-row').forEach(el => {
            el.style.display = (el.querySelector('.truncate')?.textContent || '').toLowerCase().includes(q) ? '' : 'none';
        });
    };

    function highlightFile(name) {
        $('file-list').querySelectorAll('.active-file').forEach(el => el.classList.remove('active-file'));
        const el = $('file-list').querySelector(`[data-name="${name}"]`);
        if (el) el.classList.add('active-file');
    }

    // ============================================================
    // TOOLS
    // ============================================================
    function setTool(tool) {
        currentTool = tool;
        document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('tool-active'));
        const btn = document.querySelector(`[data-tool="${tool}"]`);
        if (btn) btn.classList.add('tool-active');
        
        Object.values(fabricCanvases).forEach(fc => {
            if (!fc || !fc.lowerCanvasEl) return;
            const el = fc.lowerCanvasEl;
            if (tool === 'select') {
                el.style.pointerEvents = 'none';
                fc.isDrawingMode = false; fc.selection = false;
            } else if (tool === 'draw') {
                el.style.pointerEvents = 'auto';
                fc.isDrawingMode = true; fc.selection = false;
                fc.freeDrawingBrush.color = currentColor.replace(/[\d.]+\)$/, '1)');
                fc.freeDrawingBrush.width = 3;
            } else if (tool === 'highlight') {
                el.style.pointerEvents = 'none';
                fc.isDrawingMode = false; fc.selection = false;
            } else {
                el.style.pointerEvents = 'auto';
                fc.isDrawingMode = false; fc.selection = false;
            }
            fc.renderAll();
        });
    }

    function setColor(color) {
        currentColor = color;
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
        const btn = document.querySelector(`[data-color="${color}"]`);
        if (btn) btn.classList.add('selected');
        if (currentTool === 'draw') {
            Object.values(fabricCanvases).forEach(fc => {
                if (fc) fc.freeDrawingBrush.color = color.replace(/[\d.]+\)$/, '1)');
            });
        }
    }

    document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
    document.querySelectorAll('.color-btn').forEach(b => b.onclick = () => setColor(b.dataset.color));

    // ============================================================
    // SIDEBAR
    // ============================================================
    function renderSidebar() {
        const list = $('annotation-list');
        const count = $('annotation-count');
        if (!list || !count) return;

        const anns = getAnnotations();
        if (!anns.length) {
            list.innerHTML = `<div class="text-center py-8 text-base-content/40 text-sm">
                <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2 opacity-40"></i>
                <p>No annotations yet</p>
            </div>`;
            count.textContent = '0';
            lucide.createIcons();
            return;
        }

        anns.sort((a,b) => a.page - b.page);
        count.textContent = anns.length;

        const typeConfig = {
            highlight: { label: 'Highlight', cls: 'badge-warning', icon: 'highlighter' },
            drawing: { label: 'Drawing', cls: 'badge-info', icon: 'pen' },
            rectangle: { label: 'Rectangle', cls: 'badge-accent', icon: 'square-dashed' },
            comment: { label: 'Note', cls: 'badge-success', icon: 'sticky-note' },
        };

        list.innerHTML = anns.map((a, i) => {
            const tc = typeConfig[a.type] || { label: a.type, cls: 'badge-ghost', icon: 'circle' };
            let body = '';
            if (a.comment) body += `<p class="text-sm mt-1">${esc(a.comment)}</p>`;
            if (a.type === 'drawing' && !a.comment) body += '<p class="text-xs text-base-content/40 mt-1">Freehand drawing</p>';
            if (a.type === 'rectangle' && !a.comment) body += '<p class="text-xs text-base-content/40 mt-1">Area selection</p>';
            
            const gitHubLink = a.issueNumber
                ? `<a href="${a.issueUrl}" target="_blank" class="text-xs text-info hover:underline flex items-center gap-1 ml-auto" onclick="event.stopPropagation()" title="View on GitHub"><i data-lucide="external-link" class="w-3 h-3"></i> #${a.issueNumber}</a>`
                : `<span class="text-xs text-warning flex items-center gap-1 ml-auto" title="Not synced to GitHub"><i data-lucide="cloud-off" class="w-3 h-3"></i></span>`;

            return `<div class="card card-compact bg-base-100 border border-base-300 cursor-pointer hover:border-primary hover:shadow-md transition-all" onclick="scrollToPage(${a.page})">
                <div class="card-body p-3">
                    <div class="flex items-center gap-2 flex-wrap">
                        <span class="badge badge-xs ${tc.cls} gap-1"><i data-lucide="${tc.icon}" class="w-3 h-3"></i> ${tc.label}</span>
                        <span class="text-xs text-base-content/50">Page ${a.page}</span>
                        ${a.reviewer ? `<span class="text-xs text-base-content/40"><i data-lucide="user" class="w-3 h-3 inline"></i> ${esc(a.reviewer)}</span>` : ''}
                        ${gitHubLink}
                        <button class="btn btn-ghost btn-xs text-error p-0 min-h-0 h-6 w-6" onclick="event.stopPropagation();deleteAnnotation(${i})" title="Delete">✕</button>
                    </div>
                    ${body}
                    <div class="text-xs text-base-content/40">${new Date(a.timestamp).toLocaleString()}</div>
                </div>
            </div>`;
        }).join('');

        lucide.createIcons();
    }

    window.scrollToPage = function(pageNum) {
        const c = pageContainers[pageNum];
        if (c) {
            c.scrollIntoView({ behavior:'smooth', block:'center' });
            c.style.boxShadow = '0 0 0 4px oklch(var(--p))';
            setTimeout(() => { c.style.boxShadow = '0 4px 16px rgba(0,0,0,0.6)'; }, 1500);
        }
    };

    window.deleteAnnotation = async function(index) {
        const anns = getAnnotations();
        const ann = anns[index];
        if (!ann) return;

        // Close GitHub issue if it exists
        if (ann.issueNumber) {
            try {
                await closeAnnotationIssue(ann.issueNumber);
                toast('Closed GitHub issue #' + ann.issueNumber, 'success');
            } catch (err) {
                toast('Could not close issue: ' + err.message, 'error');
            }
        }

        // Remove from Fabric canvas
        if (ann.page && (ann.type === 'drawing' || ann.type === 'rectangle') && fabricCanvases[ann.page]) {
            fabricCanvases[ann.page].clear();
            fabricCanvases[ann.page].renderAll();
        }
        if (ann.page && ann.type === 'comment' && fabricCanvases[ann.page]) {
            fabricCanvases[ann.page].clear();
            fabricCanvases[ann.page].renderAll();
        }

        anns.splice(index, 1);
        setAnnotations(anns);
        saveLocal();
        renderSidebar();
        toast('Annotation deleted', 'success');
    };

    // ============================================================
    // ANNOTATION HELPERS
    // ============================================================
    function addAnnotation(ann) {
        const anns = getAnnotations();
        ann.reviewer = getReviewer();
        ann.timestamp = new Date().toISOString();
        anns.push(ann);
        setAnnotations(anns);
        saveLocal();
        renderSidebar();

        // Auto-sync to GitHub in background
        syncAnnotationToGitHub(ann).catch(() => {});
    }

    async function syncAnnotationToGitHub(ann) {
        try {
            const issue = await createAnnotationIssue(currentPDFName, ann);
            ann.issueNumber = issue.number;
            ann.issueUrl = issue.html_url;
            const anns = getAnnotations();
            setAnnotations(anns);
            saveLocal();
            renderSidebar();
            $('sync-badge').className = 'badge badge-sm badge-success gap-1';
            $('sync-label').textContent = 'Synced';
            setTimeout(() => {
                $('sync-badge').className = 'badge badge-sm badge-ghost gap-1';
                $('sync-label').textContent = 'GitHub';
            }, 2000);
        } catch (err) {
            console.warn('Auto-sync failed:', err.message);
        }
    }

    function saveDrawings(pageNum) {
        const fc = fabricCanvases[pageNum];
        if (!fc) return;
        const objects = fc.getObjects().map(o => o.toJSON());
        const anns = getAnnotations().filter(a => !((a.type === 'drawing' || a.type === 'rectangle') && a.page === pageNum));
        if (objects.length > 0) {
            anns.push({
                type: 'drawing', page: pageNum, objects,
                color: currentColor, reviewer: getReviewer(),
                timestamp: new Date().toISOString(),
            });
        }
        setAnnotations(anns);
        saveLocal();
        renderSidebar();
    }

    // ============================================================
    // HIGHLIGHT
    // ============================================================
    function handleHighlight(pageNum) {
        if (currentTool !== 'highlight') return;
        const sel = window.getSelection();
        const text = sel.toString().trim();
        if (!text) return;
        const container = pageContainers[pageNum];
        if (!container || !container.contains(sel.anchorNode)) return;

        const range = sel.getRangeAt(0);
        const rects = range.getClientRects();
        const cr = container.getBoundingClientRect();
        const fc = fabricCanvases[pageNum];
        if (!fc) return;

        for (let i = 0; i < rects.length; i++) {
            const r = rects[i];
            fc.add(new fabric.Rect({
                left: r.left - cr.left, top: r.top - cr.top,
                width: r.width, height: r.height,
                fill: currentColor, selectable: false, evented: false, opacity: 0.5,
            }));
        }
        fc.renderAll();

        const preview = text.length > 80 ? text.substring(0, 80) + '...' : text;
        showCommentModal(`Highlight on page ${pageNum}: "${preview}"`, (comment) => {
            const ann = {
                type: 'highlight', page: pageNum,
                comment: comment || text.substring(0, 100),
                quotedText: text, color: currentColor,
            };
            addAnnotation(ann);
            toast('Highlight saved' + (comment ? ' with comment' : ''), 'success');
        });
    }

    // ============================================================
    // STICKY NOTE
    // ============================================================
    function handleSticky(e, pageNum) {
        if (currentTool !== 'comment') return;
        const container = pageContainers[pageNum];
        if (!container) return;
        const cr = container.getBoundingClientRect();
        const x = e.clientX - cr.left;
        const y = e.clientY - cr.top;

        showCommentModal(`Note on page ${pageNum}`, (comment) => {
            if (!comment) return;
            const fc = fabricCanvases[pageNum];
            if (!fc) return;

            const rect = new fabric.Rect({
                left: x - 22, top: y - 22, width: 44, height: 44,
                fill: '#fef08a', stroke: '#ca8a04', strokeWidth: 2, rx: 4, ry: 4,
            });
            const txt = new fabric.Text('📝', { left: x - 12, top: y - 14, fontSize: 18 });
            fc.add(new fabric.Group([rect, txt], { left: x - 22, top: y - 22 }));
            fc.renderAll();

            addAnnotation({
                type: 'comment', page: pageNum, comment,
                x: Math.round(x), y: Math.round(y),
            });
            toast('Note saved!', 'success');
        });
    }

    // ============================================================
    // RECTANGLE
    // ============================================================
    let isDrawingRect = false, rectStart = null, tempRect = null;

    $('pdf-scroll-container').addEventListener('mousedown', function(e) {
        if (currentTool !== 'rectangle') return;
        const target = e.target.closest('.page-wrapper');
        if (!target) return;
        const pageNum = parseInt(target.dataset.page);
        const fc = fabricCanvases[pageNum];
        if (!fc) return;
        const ptr = fc.getPointer(e);
        isDrawingRect = true; rectStart = { x:ptr.x, y:ptr.y };
        tempRect = new fabric.Rect({
            left: ptr.x, top: ptr.y, width: 0, height: 0,
            fill: 'transparent', stroke: currentColor.replace(/[\d.]+\)$/, '1)'),
            strokeWidth: 2, strokeDashArray: [5,5],
        });
        fc.add(tempRect);
    });

    $('pdf-scroll-container').addEventListener('mousemove', function(e) {
        if (!isDrawingRect || !tempRect) return;
        const target = e.target.closest('.page-wrapper');
        if (!target) return;
        const fc = fabricCanvases[parseInt(target.dataset.page)];
        if (!fc) return;
        const ptr = fc.getPointer(e);
        tempRect.set({
            left: Math.min(ptr.x, rectStart.x),
            top: Math.min(ptr.y, rectStart.y),
            width: Math.abs(ptr.x - rectStart.x),
            height: Math.abs(ptr.y - rectStart.y),
        });
        fc.renderAll();
    });

    $('pdf-scroll-container').addEventListener('mouseup', function(e) {
        if (!isDrawingRect || currentTool !== 'rectangle') { isDrawingRect = false; return; }
        isDrawingRect = false;
        if (tempRect && tempRect.width > 5 && tempRect.height > 5) {
            tempRect.set({ strokeDashArray: null, fill: currentColor.replace(/[\d.]+\)$/, '0.3)' });
            const target = e.target.closest('.page-wrapper');
            if (target) {
                const pageNum = parseInt(target.dataset.page);
                showCommentModal(`Rectangle on page ${pageNum}`, (comment) => {
                    saveDrawings(pageNum);
                    const anns = getAnnotations();
                    const drawAnn = anns.find(a => a.type === 'drawing' && a.page === pageNum);
                    if (drawAnn) { drawAnn.comment = comment || ''; }
                    setAnnotations(anns); saveLocal();
                    renderSidebar();
                    toast('Rectangle saved', 'success');
                });
            }
        } else if (tempRect) { try { tempRect.canvas.remove(tempRect); } catch(er){} }
        tempRect = null; rectStart = null;
    });

    // ============================================================
    // DRAW COMMENT PROMPT
    // ============================================================
    function createFabricCanvasWithComment(pageNum, canvasEl) {
        const fc = new fabric.Canvas(canvasEl, {
            selection: false, isDrawingMode: false, renderOnAddRemove: true,
        });
        fc.lowerCanvasEl.style.pointerEvents = 'none';
        fc.on('object:modified', () => saveDrawings(pageNum));
        fc.on('path:created', () => {
            saveDrawings(pageNum);
            const anns = getAnnotations();
            const drawAnn = anns.find(a => a.type === 'drawing' && a.page === pageNum && !a._prompted);
            if (drawAnn && fabricCanvases[pageNum].getObjects().length > 0) {
                drawAnn._prompted = true;
                setAnnotations(anns); saveLocal();
                showCommentModal(`Drawing on page ${pageNum}`, (comment) => {
                    const currentAnns = getAnnotations();
                    const da = currentAnns.find(a => a.type === 'drawing' && a.page === pageNum && a._prompted);
                    if (da) {
                        da.comment = comment || '';
                        delete da._prompted;
                        setAnnotations(currentAnns);
                        saveLocal();
                        renderSidebar();
                        toast('Drawing saved', 'success');
                    }
                });
            }
        });
        fabricCanvases[pageNum] = fc;
        return fc;
    }

    // ============================================================
    // UNDO & CLEAR
    // ============================================================
    $('undo-btn').onclick = () => {
        const cr = $('pdf-scroll-container').getBoundingClientRect();
        let best = null, bestO = 0;
        Object.entries(pageContainers).forEach(([pn, el]) => {
            const r = el.getBoundingClientRect();
            const o = Math.max(0, Math.min(r.bottom, cr.bottom) - Math.max(r.top, cr.top));
            if (o > bestO) { bestO = o; best = parseInt(pn); }
        });
        if (!best) return;
        const fc = fabricCanvases[best];
        if (!fc) return;
        const objs = fc.getObjects();
        if (!objs.length) return;
        fc.remove(objs[objs.length - 1]); fc.renderAll();
        saveDrawings(best);
        toast('Undo', 'success');
    };

    $('clear-page').onclick = () => {
        const cr = $('pdf-scroll-container').getBoundingClientRect();
        let best = null, bestO = 0;
        Object.entries(pageContainers).forEach(([pn, el]) => {
            const r = el.getBoundingClientRect();
            const o = Math.max(0, Math.min(r.bottom, cr.bottom) - Math.max(r.top, cr.top));
            if (o > bestO) { bestO = o; best = parseInt(pn); }
        });
        if (!best) return;
        const fc = fabricCanvases[best];
        if (!fc) return;
        fc.clear(); fc.renderAll();
        const anns = getAnnotations().filter(a => a.page !== best);
        setAnnotations(anns); saveLocal();
        renderSidebar();
        toast('Cleared page ' + best, 'success');
    };

    // ============================================================
    // SYNC BUTTON
    // ============================================================
    $('sync-btn').onclick = () => syncToGitHub();

    // ============================================================
    // PDF LOADING
    // ============================================================
    async function loadPDF(contentsPath, name) {
        if (isLoadingPDF) return;
        isLoadingPDF = true;

        Object.values(fabricCanvases).forEach(fc => { try { fc.dispose(); } catch(e){} });
        fabricCanvases = {};
        pageContainers = {};
        
        currentPDFName = name;
        
        const pdfNameEl = $('current-pdf-name');
        if (pdfNameEl) pdfNameEl.textContent = name;
        highlightFile(name);
        
        const noPdfMsg = $('no-pdf-message');
        if (noPdfMsg) noPdfMsg.style.display = 'none';
        
        const toolbar = $('annotation-toolbar');
        if (toolbar) toolbar.style.display = 'flex';
        
        const scroll = $('pdf-scroll-container');
        if (!scroll) { isLoadingPDF = false; return; }
        scroll.innerHTML = '<div class="text-center py-10 text-white/50"><span class="loading loading-spinner loading-lg"></span><p class="mt-3">Loading PDF...</p></div>';

        // Load local first for instant display
        loadLocal();
        renderSidebar();

        // Then load from GitHub in background
        $('sync-badge').className = 'badge badge-sm badge-info gap-1';
        $('sync-label').textContent = 'Loading...';
        loadFromGitHub(name).then(() => {
            renderSidebar();
            $('sync-badge').className = 'badge badge-sm badge-ghost gap-1';
            $('sync-label').textContent = 'GitHub';
        }).catch(() => {
            $('sync-badge').className = 'badge badge-sm badge-ghost gap-1';
            $('sync-label').textContent = 'GitHub';
        });

        try {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            
            const resp = await fetch(PROXY + '/raw/master/' + contentsPath);
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            const data = await resp.arrayBuffer();
            
            const header = String.fromCharCode.apply(null, new Uint8Array(data.slice(0,5)));
            if (!header.startsWith('%PDF')) throw new Error('Not a valid PDF');

            const pdfDoc = await pdfjsLib.getDocument({ data }).promise;
            scroll.innerHTML = '';

            for (let i = 1; i <= pdfDoc.numPages; i++) {
                const page = await pdfDoc.getPage(i);
                const vp = page.getViewport({ scale: 1.5 });

                const wrapper = document.createElement('div');
                wrapper.className = 'page-wrapper';
                wrapper.style.width = vp.width + 'px';
                wrapper.style.height = vp.height + 'px';
                wrapper.dataset.page = i;
                pageContainers[i] = wrapper;

                const pdfCanvas = document.createElement('canvas');
                pdfCanvas.width = vp.width; pdfCanvas.height = vp.height;
                await page.render({ canvasContext: pdfCanvas.getContext('2d'), viewport: vp }).promise;
                wrapper.appendChild(pdfCanvas);

                const textContent = await page.getTextContent();
                const textLayer = document.createElement('div');
                textLayer.className = 'textLayer';
                textLayer.style.width = vp.width + 'px';
                textLayer.style.height = vp.height + 'px';

                textContent.items.forEach(item => {
                    if (!item.str) return;
                    const tx = pdfjsLib.Util.transform(vp.transform, item.transform);
                    const fontHeight = Math.sqrt(tx[2] * tx[2] + tx[3] * tx[3]);
                    const style = textContent.styles[item.fontName] || {};
                    const span = document.createElement('span');
                    span.textContent = item.str;
                    span.style.left = tx[4] + 'px';
                    span.style.top = (tx[5] - fontHeight) + 'px';
                    span.style.fontSize = fontHeight + 'px';
                    span.style.fontFamily = style.fontFamily || 'sans-serif';
                    textLayer.appendChild(span);
                });
                wrapper.appendChild(textLayer);

                const annCanvas = document.createElement('canvas');
                annCanvas.className = 'ann-canvas';
                annCanvas.width = vp.width; annCanvas.height = vp.height;
                wrapper.appendChild(annCanvas);

                createFabricCanvasWithComment(i, annCanvas);

                textLayer.addEventListener('mouseup', () => handleHighlight(i));
                wrapper.addEventListener('dblclick', (e) => handleSticky(e, i));

                const label = document.createElement('div');
                label.className = 'page-label';
                label.textContent = 'Page ' + i;
                wrapper.appendChild(label);

                scroll.appendChild(wrapper);
            }

            // Restore annotations
            const savedAnns = getAnnotations();
            savedAnns.forEach(ann => {
                if ((ann.type === 'drawing' || ann.type === 'rectangle') && ann.objects && fabricCanvases[ann.page]) {
                    fabric.util.enlivenObjects(ann.objects, objects => {
                        objects.forEach(o => fabricCanvases[ann.page].add(o));
                        fabricCanvases[ann.page].renderAll();
                    });
                }
                if (ann.type === 'comment' && ann.x && ann.y && fabricCanvases[ann.page]) {
                    const rect = new fabric.Rect({
                        left: ann.x - 22, top: ann.y - 22, width: 44, height: 44,
                        fill: '#fef08a', stroke: '#ca8a04', strokeWidth: 2, rx: 4, ry: 4,
                    });
                    const txt = new fabric.Text('📝', { left: ann.x - 12, top: ann.y - 14, fontSize: 18 });
                    fabricCanvases[ann.page].add(new fabric.Group([rect, txt], { left: ann.x - 22, top: ann.y - 22 }));
                    fabricCanvases[ann.page].renderAll();
                }
            });

            setTool('select');
            renderSidebar();
            toast(`Loaded ${pdfDoc.numPages} pages with ${savedAnns.length} annotations`, 'success');
            
        } catch (err) {
            console.error(err);
            scroll.innerHTML = `<div class="text-center py-10 text-white">
                <i data-lucide="alert-triangle" class="w-16 h-16 mx-auto mb-3 text-error opacity-60"></i>
                <p class="text-error text-lg">${esc(err.message)}</p>
            </div>`;
            lucide.createIcons();
            toast('Error: ' + err.message, 'error');
        } finally {
            isLoadingPDF = false;
        }
    }

    // ============================================================
    // PANEL TOGGLES
    // ============================================================
    $('toggle-browser').onclick = () => {
        const p = $('browser-panel');
        if (p) { p.classList.toggle('!w-0'); p.classList.toggle('!min-w-0'); }
    };
    $('toggle-annotations').onclick = () => {
        const p = $('annotation-sidebar');
        if (p) { p.classList.toggle('!w-0'); p.classList.toggle('!min-w-0'); }
    };

    // ============================================================
    // KEYBOARD
    // ============================================================
    document.addEventListener('keydown', e => {
        if (document.activeElement !== document.body && document.activeElement.tagName !== 'BODY') return;
        if (e.key === 'Escape') setTool('select');
        if (e.key === 'h') setTool('highlight');
        if (e.key === 'd') setTool('draw');
        if (e.key === 'r') setTool('rectangle');
        if (e.key === 'n') setTool('comment');
    });

    // ============================================================
    // STARTUP
    // ============================================================
    loadLocal();
    loadDir('').then(() => toast('Connected to DelMedicalRelease', 'success')).catch(err => toast(err.message, 'error'));
    </script>
</body>
</html>
